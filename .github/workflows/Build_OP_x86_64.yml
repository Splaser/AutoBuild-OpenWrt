name: Build x86_64

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x86-64-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: https://github.com/coolsnowwolf/lede.git
  SOURCE_BRANCH: master
  CONFIG_FILE: x86_64.config

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v7

      - name: Show runner diagnostics
        run: |
          set -eux
          uname -a
          lscpu
          free -h
          df -hT
          git --version

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ca-certificates ccache clang cmake cpio curl \
            device-tree-compiler file flex gawk gcc-multilib g++-multilib \
            gettext git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz genisoimage msmtp \
            nano ninja-build p7zip-full patch perl pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons \
            scdoc squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd xz-utils zlib1g-dev zstd

      - name: Clone current LEDE master
        run: |
          set -eux
          git clone --depth 1 --single-branch \
            --branch "$SOURCE_BRANCH" "$SOURCE_REPOSITORY" openwrt
          mkdir -p build-metadata
          git -C openwrt log -1 --format='%H%n%cI%n%s' | tee build-metadata/lede-revision.txt

      - name: Configure external feeds
        run: |
          set -eux
          feeds_file=openwrt/feeds.conf.default

          # Keep one authoritative Passwall source for both LuCI and its cores.
          sed -i -E '/^src-git (passwall_packages|passwall_luci) /d' "$feeds_file"
          sed -i '1i src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' "$feeds_file"
          sed -i '1i src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' "$feeds_file"

          head -n 10 "$feeds_file"
          test "$(grep -c '^src-git passwall_packages ' "$feeds_file")" -eq 1
          test "$(grep -c '^src-git passwall_luci ' "$feeds_file")" -eq 1
          cp "$feeds_file" build-metadata/feeds.conf.default

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          set -eux
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds list -s | tee ../build-metadata/feed-revisions.txt

      - name: Apply configuration and customizations
        run: |
          set -eux
          cp "$CONFIG_FILE" openwrt/.config
          cp "$CONFIG_FILE" build-metadata/x86_64.config.requested
          sh ./customize.sh openwrt

          cd openwrt
          make defconfig
          cp .config ../build-metadata/x86_64.config.resolved

          grep -E '^CONFIG_PACKAGE_.*=y$' .config \
            | sort \
            | tee ../build-metadata/selected-packages.txt

          sed -n -E 's/^(CONFIG_[A-Za-z0-9_-]+)=.*/\1/p' \
            ../build-metadata/x86_64.config.requested | sort -u \
            > ../build-metadata/requested-symbols.txt
          sed -n -E 's/^(CONFIG_[A-Za-z0-9_-]+)=.*/\1/p' .config | sort -u \
            > ../build-metadata/resolved-symbols.txt
          comm -23 \
            ../build-metadata/requested-symbols.txt \
            ../build-metadata/resolved-symbols.txt \
            | tee ../build-metadata/dropped-symbols.txt

          test ! -s ../build-metadata/dropped-symbols.txt || {
            echo '::warning::Some requested Kconfig symbols were dropped; see build metadata.'
          }

          require_config() {
            if ! grep -Fqx "$1" .config; then
              echo "::error::Required firmware feature was not selected after defconfig: $1"
              exit 1
            fi
          }

          require_config 'CONFIG_TARGET_x86=y'
          require_config 'CONFIG_TARGET_x86_64=y'
          require_config 'CONFIG_TARGET_x86_64_DEVICE_generic=y'
          require_config 'CONFIG_GRUB_EFI_IMAGES=y'
          require_config 'CONFIG_PACKAGE_luci-app-passwall=y'
          require_config 'CONFIG_PACKAGE_luci-app-ssr-plus=y'
          require_config 'CONFIG_PACKAGE_luci-app-docker=y'

      - name: Download sources
        working-directory: openwrt
        run: |
          set -eux
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          echo "Starting parallel build with $(nproc) jobs"
          if ! make -j"$(nproc)"; then
            echo '::warning::Parallel build failed; retrying serially with verbose output.'
            make -j1 V=s
          fi

      - name: Show post-build disk usage
        if: always()
        run: df -hT

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x86-64-build-metadata-${{ github.run_number }}
          path: build-metadata/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload x86_64 firmware
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt-x86-64-${{ github.run_number }}
          path: openwrt/bin/targets/x86/64/
          if-no-files-found: error
          compression-level: 0
